name: Build

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PicoJoybus Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/networkfusion/n64-picojoybus-devcontainer
          cacheFrom: ghcr.io/networkfusion/n64-picojoybus-devcontainer
          push: ${{ github.repository_owner == 'networkfusion' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/develop
          runCmd: |
            cmake -S . -B build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N64-PicoJoybus
          path: |
            ./build/PicoJoybus.uf2
            ./build/PicoJoybus.bin
            ./build/PicoJoybus.elf
            ./build/PicoJoybus.elf.map
            ./build/PicoJoybus.elf.hex
            ./build/PicoJoybus.dis
